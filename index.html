<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Information</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 60px 20px;
    }

    .card {
        background: linear-gradient(145deg, #111827, #0b1220);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
        font-size: 30px;
        margin-bottom: 10px;
        color: #ffffff;
    }

    h2 {
        font-size: 16px;
        font-weight: normal;
        color: #9ca3af;
        margin-bottom: 25px;
    }

    .section {
        margin-bottom: 20px;
    }

    .label {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 5px;
    }

    .value {
        font-size: 17px;
        color: #f8fafc;
    }

    .highlight {
        color: #38bdf8;
        word-break: break-word;
    }

    .divider {
        height: 1px;
        background: rgba(255,255,255,0.08);
        margin: 30px 0;
    }

    /* Dari section */
    .rtl {
        direction: rtl;
        text-align: right;
        font-family: Tahoma, Arial, sans-serif;
    }

    @media (max-width: 600px) {
        .card {
            padding: 25px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <!-- English -->
        <section>
            <h1>Contact Information</h1>
            <h2>Get in touch with us anytime</h2>

            <div class="section">
                <div class="label">Email</div>
                <div class="value highlight">saalakar.adviser@gmail.com</div>
            </div>

            <div class="section">
                <div class="label">Phone</div>
                <div class="value highlight">+93707450467</div>
            </div>
        </section>

        <div class="divider"></div>

        <!-- Dari -->
        <section class="rtl" dir="rtl">
            <h1>اطلاعات تماس</h1>
            <h2>هر زمان با ما در تماس شوید</h2>

            <div class="section">
                <div class="label">ایمیل</div>
                <div class="value highlight">saalakar.adviser@gmail.com</div>
            </div>

            <div class="section">
                <div class="label">شماره تماس</div>
                <div class="value highlight">+93707450467</div>
            </div>
        </section>

    </div>
</div>

</body>
</html>

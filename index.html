<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #ffffff;
        color: #000;
    }

    .container {
        max-width: 850px;
        margin: auto;
        padding: 60px 20px;
    }

    .card {
        border: 2px solid #000;
        padding: 40px;
        border-radius: 14px;
        background: #fff;
        animation: fadeIn 1.2s ease-in-out;
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    h1 {
        font-size: 30px;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    h2 {
        font-size: 15px;
        font-weight: normal;
        margin-bottom: 30px;
        color: #333;
    }

    .section {
        margin-bottom: 22px;
        padding: 12px;
        border-left: 3px solid #000;
        transition: all 0.3s ease;
    }

    .section:hover {
        background: #000;
        color: #fff;
        transform: translateX(5px);
    }

    .label {
        font-size: 13px;
        opacity: 0.7;
    }

    .value {
        font-size: 18px;
        margin-top: 4px;
        word-break: break-word;
    }

    .divider {
        height: 1px;
        background: #000;
        margin: 30px 0;
        opacity: 0.3;
    }

    .rtl {
        direction: rtl;
        text-align: right;
        border-top: 1px dashed #000;
        padding-top: 20px;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @media (max-width: 600px) {
        .card {
            padding: 25px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Contact Information</h1>
        <h2>Professional consulting services — reach out anytime</h2>

        <div class="section">
            <div class="label">Email</div>
            <div class="value">saalakar.adviser@gmail.com</div>
        </div>

        <div class="section">
            <div class="label">Phone</div>
            <div class="value">+93707450467</div>
        </div>

        <div class="divider"></div>

        <div class="rtl">
            <h1>اطلاعات تماس</h1>
            <h2>خدمات مشورتی حرفه‌ای — هر زمان در تماس شوید</h2>

            <div class="section">
                <div class="label">ایمیل</div>
                <div class="value">saalakar.adviser@gmail.com</div>
            </div>

            <div class="section">
                <div class="label">شماره تماس</div>
                <div class="value">+93707450467</div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
